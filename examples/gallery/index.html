<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ascii-dither gallery</title>
    <style>
      * { box-sizing: border-box; }
      html, body, #root { height: 100%; margin: 0; }
      body { background: #050807; color: #f4f4f4; font: 14px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .stage { position: relative; height: 100%; overflow: hidden; }
      .backdrop { position: absolute; inset: 0; }
      .panel { position: absolute; inset: auto 0 0 0; display: grid; gap: 10px; padding: 12px; background: rgb(0 0 0 / 0.72); }
      .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      .names { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
      button { flex: none; min-height: 36px; padding: 0 12px; border: 1px solid rgb(255 255 255 / 0.28); border-radius: 6px; background: transparent; color: inherit; font: inherit; cursor: pointer; }
      button:hover { border-color: #fff; }
      button[aria-pressed="true"] { background: #f4f4f4; color: #0b0b0b; border-color: #f4f4f4; }
      button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
      code { flex: 1 1 240px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      h1 { margin: 0; font-size: 14px; font-weight: 600; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
